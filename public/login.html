html, body {
  height: 100%;
  background: var(--page);
  margin: 0; padding: 0;
}
body {
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow: hidden;
  font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
button, input { font-family: inherit; }
a { text-decoration: none; }

.stage { position: fixed; inset: 0; overflow: hidden; }
.photo { position: absolute; left: 0; top: 0; height: 100%; width: 57.1038%; overflow: hidden; }
.photo-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 100% 50%; display: block; -webkit-user-drag: none;
}
.photo-img--wide { display: none; }
.scrim { display: none; }
.hero { position: absolute; left: 0; bottom: 0; width: 836px; height: 949px; transform-origin: left bottom; pointer-events: none; }
.hero > * { pointer-events: auto; }

.badge {
  position: absolute; left: var(--badge-left); top: var(--badge-top);
  display: inline-flex; align-items: center; justify-content: center;
  height: 37px; padding: 0 16px 0 19px; border-radius: 999px;
  background: var(--badge-bg);
  backdrop-filter: blur(7px) saturate(120%);
  -webkit-backdrop-filter: blur(7px) saturate(120%);
  box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
  color: #fff; white-space: nowrap;
  font-size: var(--badge-fs); font-weight: var(--badge-fw);
  letter-spacing: var(--badge-ls); word-spacing: var(--badge-ws); gap: var(--badge-gap);
}
.badge svg { position: relative; top: -1px; width: 17px; height: 16.27px; flex-shrink: 0; }
#badgeTxt { position: relative; top: var(--badge-dy); }

.hl-wrap { display: block; }
.hl {
  position: absolute;
  font-family: 'Eloquia', sans-serif;
  font-variation-settings: 'wght' var(--hl-wght);
  line-height: var(--hl-lh);
  color: var(--ink);
  white-space: nowrap;
}
#hl1 { left: var(--hl1-left); top: var(--hl1-top); font-size: var(--hl1-fs); letter-spacing: var(--hl1-ls); word-spacing: var(--hl1-ws); }
#hl2 { left: var(--hl2-left); top: var(--hl2-top); font-size: var(--hl2-fs); letter-spacing: var(--hl2-ls); }

.pane { position: absolute; left: 57.1038%; right: 0; top: 0; bottom: 0; }
.card {
  position: absolute; left: 1px; top: 14px; width: 613px; height: 922px;
  border-radius: 26px; overflow: hidden;
  background: rgba(254,254,254,.90);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(0,0,0,.036);
  box-shadow: var(--card-shadow);
}
.card-in { position: absolute; left: 0; top: 0; width: 613px; height: 922px; transform-origin: left top; }

.col { position: absolute; left: 62px; width: 488px; }
.col.center { text-align: center; }

(function(){

  var CONTENT_H=697;
  var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
  var PANE_RATIO=PANE_W/REF_W;
  var HERO_W=681, HERO_H=219;
  var REF_CARD_ASPECT=692/855;
  var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;
  var RAMP_LO2=820, PHOTO_MIN2=0.36;
  var TP={"pad":0.1076,"h1Top":0.08656,"h1Fs":0.06839,"subTop":0.17368,"subFs":0.0309,"emTop":0.25435,"emH":0.10257,"emR":0.0202,"ephFs":0.02702,"ephPad":0.0332,"pwTop":0.36851,"pwH":0.10839,"btnTop":0.50435,"btnH":0.10981,"btnFs":0.0275,"arrow":0.026,"btnGap":0.02,"divTop":0.68222,"orFs":0.02245,"orPad":0.051,"divH":0.0026,"gTop":0.76445,"gH":0.09966,"gIcon":0.032,"gtFs":0.03205,"gGap":0.026,"btTop":0.89668,"btFs":0.02876,"badgeH":0.0742,"heroFs":0.1058,"heroLh":1.1246,"heroBot":0.06493,"heroGap":-0.30423,"heroSide":0.0525};

  var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

  var body = document.body;
  var photo = document.querySelector('.photo');
  var pane = document.querySelector('.pane');
  var card = document.querySelector('.card');
  var cardIn = document.querySelector('.cardIn') || document.querySelector('.card-in');
  var hero = document.getElementById('hero');

  function clearInline() {
    [photo, pane, card, cardIn, hero].forEach(function(el){ if(el) el.style.cssText = ''; });
  }

  function headlineMeasure() {
    var s = document.createElement('span');
    s.style.cssText = "position:absolute;visibility:hidden;font-family:'Eloquia',sans-serif;font-variation-settings:'wght' 578;font-size:69.14px;letter-spacing:-1.936px;white-space:nowrap;";
    s.innerText = "Find Signal to Action Instantly";
    document.body.appendChild(s);
    var w = s.getBoundingClientRect().width;
    document.body.removeChild(s);
    return w;
  }

  function setMode(mode, vw, vh) {
    body.className = mode;
    clearInline();
    if (mode === 'phone') {
      body.style.setProperty('--mobile-hero-h', 'clamp(244px, 34svh, 304px)');
      return;
    }
    
    if (mode === 'land') {
      var photoRatio;
      if (vw >= RAMP_HI) photoRatio = 1 - PANE_RATIO;
      else if (vw >= RAMP_LO) photoRatio = PHOTO_MIN + (1 - PANE_RATIO - PHOTO_MIN) * ((vw - RAMP_LO)/(RAMP_HI - RAMP_LO));
      else if (vw >= RAMP_LO2) photoRatio = PHOTO_MIN2 + (PHOTO_MIN - PHOTO_MIN2) * ((vw - RAMP_LO2)/(RAMP_LO - RAMP_LO2));
      else photoRatio = PHOTO_MIN2;

      var photoW = vw * photoRatio;
      var paneW = vw - photoW;

      photo.style.width = photoW + 'px';
      pane.style.left = photoW + 'px';
      pane.style.width = paneW + 'px';

      var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
      var gapL = 1 * cs, mT = 14 * cs, mB = 13 * cs, mR = 14 * cs;

      card.style.left = gapL + 'px';
      card.style.top = mT + 'px';
      card.style.width = cw + 'px';
      card.style.height = (vh - mT - mB) + 'px';
      card.style.borderRadius = (26 * cs) + 'px';
      card.style.borderWidth = Math.max(1, cs) + 'px';
      cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';

      var imgScale = Math.max(photoW / IMG_W, vh / IMG_H);
      var s = Math.min(imgScale / IMG_REF_SCALE, (photoW * 0.92) / HERO_W);

      var band = Math.round(vh * 0.425);
      body.style.setProperty('--band-h', band + 'px');
      body.style.setProperty('--tp-hero-side', Math.round(vw * 0.0525) + 'px');
      body.style.setProperty('--tp-hero-b', Math.round(vh * 0.0297) + 'px');

      body.style.setProperty('--badge-k', (band * 0.0742 / 37).toString());
      body.style.setProperty('--hl-measure', Math.round(headlineMeasure() * 0.61) + 'px');
      
      var ch = vh - band;
      var S = Math.min(ch, vw * REF_CARD_ASPECT);
      
      body.style.setProperty('--tp-gap-l', '0px');
      body.style.setProperty('--tp-gap-r', '0px');
      body.style.setProperty('--tp-m-t', '0px');
      body.style.setProperty('--tp-m-b', '0px');

      Object.keys(TP).forEach(function(k){
        var kebab = k.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
        body.style.setProperty('--tp-' + kebab, (S * TP[k]) + 'px');
      });
      var styleStr = "";
      styleStr += "#h1{font-size:var(--tp-h1-fs);top:var(--tp-h1-top);letter-spacing:calc(var(--h1-ls)/var(--h1-fs)*var(--tp-h1-fs));}";
      styleStr += "#sub{font-size:var(--tp-sub-fs);top:var(--tp-sub-top);letter-spacing:calc(var(--sub-ls)/var(--sub-fs)*var(--tp-sub-fs));}";
      var dyn = document.getElementById('tp-dyn');
      if(!dyn){
        dyn = document.createElement('style');
        dyn.id = 'tp-dyn';
        document.head.appendChild(dyn);
      }
      dyn.innerHTML = "body.tabport " + styleStr;
    }
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (vw < 700) setMode('phone', vw, vh);
    else if (mqPortrait.matches) setMode('tabport', vw, vh);
    else setMode('land', vw, vh);
  }

  window.addEventListener('resize', layout, {passive: true});
  window.addEventListener('orientationchange', layout);
  mqLandscape.addEventListener('change', layout);
  mqPortrait.addEventListener('change', layout);
  if(document.fonts) document.fonts.ready.then(layout);
  layout();
})();

    { s: '#hl2', d: 330, dur: 760, e: ease, from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' }, to: { clipPath: 'inset(0 0 0 0)' } },
    { s: '#h1', d: 470, dur: 620, e: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
    { s: '#sub', d: 570, dur: 560, e: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
    { s: '#email', d: 720, dur: 520, e: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
    { s: '#pw', d: 790, dur: 520, e: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
    { s: '#loginBtn', d: 930, dur: 560, e: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
    { s: '.divider', d: 1060, dur: 440, e: softEase, from: { opacity: 0, transform: 'translateY(6px)' } },
    { s: '#gBtn', d: 1150, dur: 540, e: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
    { s: '#bottom', d: 1260, dur: 500, e: softEase, from: { opacity: 0, transform: 'translateY(6px)' } }
  ];

  var running = [];

  function start() {
    html.classList.remove('entry-pending');
    anims.forEach(function(a) {
      var el = document.querySelector(a.s);
      if(!el) return;
      var to = Object.assign({ opacity: 1, transform: 'none' }, a.to || {});
      var anim = el.animate([a.from, to], { delay: a.d, duration: a.dur, easing: a.e, fill: 'both' });
      running.push(anim.finished);
    });

    Promise.allSettled(running).then(function() {
      anims.forEach(function(a) {
        var el = document.querySelector(a.s);
        if(el) {
          var acts = el.getAnimations();
          acts.forEach(function(ac){ ac.cancel(); });
        }
      });
      running = [];
      releaseEntrance();
    });
  }

  var fontP = document.fonts ? document.fonts.ready : Promise.resolve();
  var timeP = new Promise(function(r){ setTimeout(r, 650); });
  Promise.race([fontP, timeP]).then(function() {
    requestAnimationFrame(function(){ requestAnimationFrame(start); });
  });
})();
</script>
<script src="https://accounts.google.com/gsi/client?onload=initGoogleSignIn" async defer></script>
<script>
(function() {
  var clientId = "981402426889-d6gu6tt3sbphcdpkurj9qdmk8buuiadn.apps.googleusercontent.com";

  function decodeJwtResponse(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }

  function handleCredentialResponse(response) {
    try {
      document.body.style.opacity = '0.5';
      var payload = decodeJwtResponse(response.credential);
      var newUser = {
        sub: payload.sub,
        name: payload.name || payload.email.split('@')[0],
        email: payload.email,
        picture: payload.picture || '',
        given_name: payload.given_name,
        family_name: payload.family_name,
      };
      localStorage.setItem('noir_google_user', JSON.stringify(newUser));
      window.location.href = '/';
    } catch(e) {
      console.error('Error handling credential', e);
      document.body.style.opacity = '1';
    }
  }

  window.initGoogleSignIn = function () {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse
      });

      var gBtn = document.getElementById('gBtn');
      if (gBtn) {
        // Clear the custom styling and content to inject the official button
        gBtn.innerHTML = '';
        gBtn.style.background = 'transparent';
        gBtn.style.border = 'none';
        gBtn.style.boxShadow = 'none';
        
        // Render the official Google button right inside the slot
        google.accounts.id.renderButton(
          gBtn,
          { theme: "outline", size: "large", type: "standard", shape: "pill", width: 400, text: "signin_with" }
        );
      }
      
      // Also attach to the primary login button to trigger the One Tap prompt as fallback
      var loginBtn = document.getElementById("loginBtn");
      if (loginBtn) {
        loginBtn.onclick = function(e) {
          e.preventDefault();
          google.accounts.id.prompt();
        };
      }
    }
  };
})();
</script>
